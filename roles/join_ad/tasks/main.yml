---
- name: Set hostname (FQDN)
  ansible.builtin.hostname:
    name: "{{ inventory_hostname_short }}.{{ domain_name }}"

- name: Install required packages for AD join
  ansible.builtin.apt:
    name:
      - realmd
      - libnss-sss
      - libpam-sss
      - sssd
      - sssd-tools
      - adcli
      - samba-common-bin
      - oddjob
      - oddjob-mkhomedir
      - packagekit
      - resolvconf
    state: present
    update_cache: true

- name: Enable resolvconf service
  ansible.builtin.systemd:
    name: resolvconf.service
    enabled: true
    state: started

- name: Configure static DNS nameservers pointing to AD
  ansible.builtin.template:
    src: resolv_head.j2
    dest: /etc/resolvconf/resolv.conf.d/head
    owner: root
    group: root
    mode: '0644'
  notify: Apply resolvconf

- name: Flush handlers so DNS is applied before realm join
  ansible.builtin.meta: flush_handlers

- name: Check current realm membership
  ansible.builtin.command: realm list
  register: realm_status
  changed_when: false

- name: Join server to AD domain
  ansible.builtin.shell: |
    set -o pipefail
    echo '{{ join_password }}' | realm join --user={{ join_user }} {{ domain_name }}
  args:
    executable: /bin/bash
  when: domain_name not in realm_status.stdout
  no_log: true
  register: realm_join_result

- name: Deploy sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart sssd

- name: Ensure pam_mkhomedir is enabled (create home dir on first login)
  ansible.builtin.command: pam-auth-update --enable mkhomedir
  register: pam_mkhomedir_result
  changed_when: "'mkhomedir' not in pam_mkhomedir_result.stdout"

- name: Enable and start sssd service
  ansible.builtin.systemd:
    name: sssd.service
    enabled: true
    state: started

- name: Flush handlers so sssd restart happens before permit/sudo steps
  ansible.builtin.meta: flush_handlers

- name: Permit AD group to log in to this server
  ansible.builtin.command: "realm permit -g {{ group_permit_login }}"
  register: realm_permit_result
  changed_when: "'already' not in realm_permit_result.stderr"

- name: Grant sudo (NOPASSWD) to AD group
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "%{{ group_permit_login }} ALL=(ALL:ALL) NOPASSWD:ALL"
    validate: 'visudo -cf %s'
    state: present

- name: Grant sudo (NOPASSWD) to individual AD admin users
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ item }} ALL=(ALL) NOPASSWD:ALL"
    validate: 'visudo -cf %s'
    state: present
  loop: "{{ sudo_admin_users }}"
